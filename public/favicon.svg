<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- O Selo, símbolo dos Cavaleiros (art/mark/selo.svg no jogo): o brasão com duas camadas e a Estilha entre elas -->
  <rect width="64" height="64" rx="14" fill="#12101a"/>
  <g transform="translate(4 3.5) scale(0.56)">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="0.45" stop-color="#ffb424"/><stop offset="1" stop-color="#c8781a"/></linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24348a"/><stop offset="1" stop-color="#101842"/></linearGradient>
    <clipPath id="in"><path d="M50 10.5 L84.5 22 V50 C84.5 70.5 67 84 50 91.5 C33 84 15.5 70.5 15.5 50 V22 Z"/></clipPath>
  </defs>
  <path d="M50 3 L91 16.5 V50 C91 75 70 90.5 50 98.5 C30 90.5 9 75 9 50 V16.5 Z" fill="#0c1022"/>
  <path d="M50 5.5 L88.5 18.3 V50 C88.5 73.5 68.8 88.3 50 96 C31.2 88.3 11.5 73.5 11.5 50 V18.3 Z" fill="url(#rim)"/>
  <path d="M50 10.5 L84.5 22 V50 C84.5 70.5 67 84 50 91.5 C33 84 15.5 70.5 15.5 50 V22 Z" fill="url(#field)"/>
  <g clip-path="url(#in)">
    <polygon points="50,10 85,22 85,92 50,92" fill="#0a1136" opacity="0.45"/>
    <polygon points="15,22 50,10.5 50,16 20,26" fill="#5368d8" opacity="0.35"/>
  </g>
  <path d="M50 13.5 L81.5 24 V50 C81.5 68.5 65.5 81 50 88 C34.5 81 18.5 68.5 18.5 50 V24 Z" fill="none" stroke="#ffcf5e" stroke-width="0.9" opacity="0.55"/>
  <!-- camada de cima -->
  <polygon points="24,27.5 50,40.5 50,52.5 24,39.5" fill="#ffd36b"/>
  <polygon points="50,40.5 76,27.5 76,39.5 50,52.5" fill="#e0911f"/>
  <polyline points="24,27.5 50,40.5 76,27.5" fill="none" stroke="#fff3c9" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- camada de baixo -->
  <polygon points="24,55.5 50,68.5 50,80.5 24,67.5" fill="#ffb424"/>
  <polygon points="50,68.5 76,55.5 76,67.5 50,80.5" fill="#a8641a"/>
  <polyline points="24,55.5 50,68.5 76,55.5" fill="none" stroke="#ffe29a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- a Estilha -->
  <polygon points="50,36.5 59.5,54 50,71.5 40.5,54" fill="#0c1022" stroke="#0c1022" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="50,36.5 50,54 40.5,54" fill="#5cf0ff"/>
  <polygon points="50,36.5 59.5,54 50,54" fill="#20c8e6"/>
  <polygon points="40.5,54 50,54 50,71.5" fill="#20c8e6"/>
  <polygon points="50,54 59.5,54 50,71.5" fill="#0f8fb0"/>
  <polygon points="50,36.5 50,49 44.5,53.2" fill="#e2fdff"/>
  <path d="M63 38 L64.2 41.3 L67.5 42.5 L64.2 43.7 L63 47 L61.8 43.7 L58.5 42.5 L61.8 41.3 Z" fill="#ffffff" opacity="0.9"/>
